
name: PipelineVerse CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # Job 1: Test the application and build Docker image
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Build Docker image
        run: docker build -t pipelineverse:ci .

  # Job 2: Publish Docker image to GitHub Container Registry
  deploy-image:
    name: Deploy Docker Image
    runs-on: ubuntu-latest

    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bhuvan-35/pipelineverse:latest
            ghcr.io/bhuvan-35/pipelineverse:${{ github.sha }}
